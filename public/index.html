<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone - Gaming Cafe Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: { DEFAULT: '#111827', light: '#1F2937' },
                        sidebar: '#0D1220',
                    },
                    keyframes: {
                        'pulse-slow': { '0%, 100%': { opacity: 1 }, '50%': { opacity: .5 } },
                        'fadeIn': { 'from': { opacity: '0', transform: 'translateY(10px)' }, 'to': { opacity: '1', transform: 'translateY(0)' } },
                        'slideUp': { 'from': { opacity: '0', transform: 'translateY(30px)' }, 'to': { opacity: '1', transform: 'translateY(0)' } },
                        'scaleIn': { 'from': { opacity: '0', transform: 'scale(.9)' }, 'to': { opacity: '1', transform: 'scale(1)' } },
                        'slideIn': { 'from': { transform: 'translateX(-100%)' }, 'to': { transform: 'translateX(0)' } }
                    },
                    animation: {
                        'pulse-slow': 'pulse-slow 2s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'scale-in': 'scaleIn 0.3s ease-out',
                        'slide-in': 'slideIn 0.5s ease-out'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#0b0f19]">
    <div id="app"></div>
    <script src="./js/store.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
